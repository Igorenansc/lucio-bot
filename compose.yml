name: music-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lucio:
    build:
      context: ./Lucio

    restart: unless-stopped

    init: true

    env_file:
      - ./.env

    environment:
      NODE_ENV: production
      LOG_LEVEL: info

      LAVALINK_URL: lavalink:2333
      LAVALINK_SECURE: "false"

      NODE_OPTIONS: "--max-old-space-size=192"

    depends_on:
      lavalink:
        condition: service_healthy

    mem_limit: 256m

    networks:
      - lucio-network

    logging: *default-logging

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine

    restart: unless-stopped

    environment:
      _JAVA_OPTIONS: "-Xms128m -Xmx288m"

      LAVALINK_PASSWORD: "${LAVALINK_PASSWORD}"
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"
      YT_CIPHER_TOKEN: "${YT_CIPHER_TOKEN}"

    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro

    expose:
      - "2333"

    depends_on:
      - yt-cipher

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --header='Authorization: ${LAVALINK_PASSWORD}' -q --spider http://localhost:2333/version || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

    mem_limit: 416m

    networks:
      - lucio-network

    logging: *default-logging

  yt-cipher:
    build:
      context: https://github.com/kikkia/yt-cipher.git#master

    restart: unless-stopped

    environment:
      PORT: "8001"
      API_TOKEN: "${YT_CIPHER_TOKEN}"
      OVERRIDE_PLAYER_VARIANT: IAS
      MAX_THREADS: "1"
      PREPROCESSED_CACHE_SIZE: "32"

    expose:
      - "8001"

    mem_limit: 128m

    networks:
      - lucio-network

    logging: *default-logging

networks:
  lucio-network:
    driver: bridge
